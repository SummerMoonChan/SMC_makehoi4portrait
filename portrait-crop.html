<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钢四头像裁剪</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202326;color:#eee;font:15px system-ui}main{max-width:1240px;margin:22px auto;padding:0 22px}h1{font-size:23px;margin:0 0 20px}h2{font-size:15px;font-weight:500;margin:0 0 14px}.workspace{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(460px,1.15fr);gap:24px;align-items:start}.crop-panel,.right-panel{min-width:0}.crop-panel{padding:16px;background:#292d31;border-radius:8px}header{margin:0 0 16px}header label{display:block}#file{display:block;max-width:100%;margin-top:10px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,input{font:inherit}button{padding:7px 11px;cursor:pointer}button:disabled{cursor:default}input[type=number]{width:76px}input[type=range]{width:100%;margin:2px 0;order:3}input[type=text]{padding:5px 7px;min-width:0}#size{font-size:13px;color:#bbb}canvas{display:block;max-width:100%;background:#333;touch-action:none;cursor:move}#canvas{width:100%;max-width:420px;height:auto;margin:12px auto 0}.hint,p,small{color:#bbb}.hint{font-size:13px;line-height:1.6}#status{font-size:13px;min-height:20px}.config-panel{padding:16px;background:#292d31;border-radius:8px}.config-panel summary{font-size:16px;cursor:pointer}#localPanel>p{font-size:13px;line-height:1.6;margin:12px 0}#localPanel .controls>label:has(input[type=text]){flex:1 1 260px;display:flex;flex-direction:column;gap:5px;font-size:13px}#localPanel input[type=text]{width:100%}#localPanel .controls:has([data-choose]){align-items:end}#localPanel [data-choose]{flex:0 0 auto}#localStatus{white-space:pre-wrap;overflow-wrap:anywhere}.preview-panel{margin-top:16px;padding:18px;background:#292d31;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.preview-item{min-width:0}.preview-item img[hidden]{display:none}.preview-item img{display:block;max-width:100%;height:auto}.checker{background:repeating-conic-gradient(#555 0% 25%,#777 0% 50%) 0 / 16px 16px}.preview-item small{display:block;margin-top:10px;font-size:12px;line-height:1.6}.preview-note{grid-column:1/-1;font-size:12px;line-height:1.6;margin:0}@media(max-width:850px){.workspace{grid-template-columns:1fr}.crop-panel{max-width:520px;width:100%;justify-self:center}}@media(max-width:420px){main{padding:0 12px}.preview-panel{gap:12px;padding:12px}button{padding:7px 9px}}
</style>
<main>
<h1>钢四头像裁剪 · 26∶35</h1>
<div class="workspace">
<section class="crop-panel" aria-label="图片裁剪">
<header><label>导入图片 <input id="file" type="file" accept="image/*"></label></header>
<div class="controls"><label>倍数 <input id="multiple" type="number" min="1" value="6" step="1" disabled></label><input id="slider" aria-label="裁剪框倍数" type="range" min="1" max="60" value="6" disabled><span id="size">156 × 210 像素</span></div>
<p class="hint">拖动白框调整位置；滑条或数字调整大小，最高 60 倍。</p>
<div id="status" role="status">请选择图片。图片仅在本机处理。</div>
<canvas id="canvas" width="1000" height="600"></canvas>
</section>
<aside class="right-panel">
<details open class="config-panel">
<summary>本地配置与图片输出</summary>
<div id="localPanel">
<p>路径会自动记住。修改模板原文件后，点击“重新加载模板”。</p>
<div class="controls"><label>大头像背景 <input id="cfgBackground" type="text"></label><button data-choose="background">选择图片</button></div>
<div class="controls"><label>小顾问上层模板 <input id="cfgAdvisor" type="text"></label><button data-choose="advisor">选择图片</button></div>
<div class="controls"><label>大头像输出目录 <input id="cfgPortraitDir" type="text"></label><button data-choose="portrait_dir">选择文件夹</button></div>
<div class="controls"><label>小顾问输出目录 <input id="cfgAdvisorDir" type="text"></label><button data-choose="advisor_dir">选择文件夹</button></div>
<div class="controls"><button id="applyConfig">保存路径并加载模板</button><button id="reloadTemplates">重新加载模板</button></div>
<div class="controls"><label>文件名 <input id="outputName" type="text" placeholder="如 GER_example_person"></label><label><input id="overwrite" type="checkbox">覆盖同名文件</label><button id="writePortrait" disabled>保存大头像</button><button id="writeAdvisor" disabled>保存小顾问</button><button id="writeBoth" disabled>保存两张图片</button></div>
<p id="localStatus" role="status">正在连接本地服务…</p>
</div></details>
<section class="preview-panel" aria-label="成品预览">
<div class="preview-item">
<h2>大头像 · 156 × 210</h2>
<img id="preview" alt="成品预览" width="156" height="210" class="checker">
<small>背景位于头像下层。</small>
</div>
<div class="preview-item">
<h2>小顾问头像</h2>
<img id="advisorPreview" alt="请导入人物图片" hidden class="checker">
<small id="advisorStatus">正在读取 advisor.png…</small>
<small>逆时针 4.25° · 669 × 864 · (43, 73) → 64 × 64</small>
</div>
<p class="preview-note">松手后生成 Lanczos＋锐化成品。可直接保存到输出目录，也可右键图片另存为。</p>
</section>
</aside>
</div>
</main>
<script>
'use strict';
const file=document.getElementById('file'),multiple=document.getElementById('multiple'),slider=document.getElementById('slider'),size=document.getElementById('size'),status=document.getElementById('status'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=null,x=0,y=0,n=6,limit=60,scale=1,drag=null,name='portrait',loadToken=0;
const preview=document.getElementById('preview');
let background=null,backgroundToken=0,renderVersion=0,readyVersion=-1;const displayImage=document.createElement('canvas');
const advisorPreview=document.getElementById('advisorPreview'),advisorStatus=document.getElementById('advisorStatus');
let advisor=null,advisorToken=0,advisorFrame=0;
function queueAdvisor(){renderOutput(!drag&&!sliderActive);}
async function renderAdvisor(highQuality=true,version=renderVersion){
 if(!advisor||!img){advisorPreview.hidden=true;return;}
 if(img.naturalWidth<64||img.naturalHeight<64){advisorPreview.hidden=true;advisorStatus.textContent='小顾问人物原图的宽和高均须至少 64 像素。';return;}
 const factor=highQuality?1:Math.min(1,210/(35*n));const w=Math.round(26*n*factor),h=Math.round(35*n*factor);
 const source=document.createElement('canvas');source.width=w;source.height=h;
 const s=source.getContext('2d');s.imageSmoothingQuality='high';
 if(background)s.drawImage(background,0,0,w,h);
 s.drawImage(img,x,y,26*n,35*n,0,0,w,h);
 const angle=-4.25*Math.PI/180,c=Math.abs(Math.cos(angle)),t=Math.abs(Math.sin(angle));
 const rotated=document.createElement('canvas');rotated.width=Math.ceil(w*c+h*t);rotated.height=Math.ceil(h*c+w*t);
 const r=rotated.getContext('2d');r.imageSmoothingQuality='high';r.translate(rotated.width/2,rotated.height/2);r.rotate(angle);r.drawImage(source,-w/2,-h/2);
 const out=document.createElement('canvas');out.width=highQuality?advisor.naturalWidth:64;out.height=highQuality?advisor.naturalHeight:64;
 const p=out.getContext('2d');p.imageSmoothingEnabled=true;p.imageSmoothingQuality='high';
 if(highQuality){
  const resized=await resizeLanczos(rotated,669,864,version,0);if(!resized||version!==renderVersion)return;
  p.drawImage(resized,43,73);p.drawImage(advisor,0,0);
  const final=await resizeLanczos(out,64,64,version);if(!final||version!==renderVersion)return;
  advisorPreview.src=final.toDataURL('image/png');
 }else{
  const sx=64/advisor.naturalWidth,sy=64/advisor.naturalHeight;
  p.drawImage(rotated,43*sx,73*sy,669*sx,864*sy);p.drawImage(advisor,0,0,64,64);
  advisorPreview.src=out.toDataURL('image/png');
 }
 advisorPreview.hidden=false;
 advisorStatus.textContent='成品 64 × 64；advisor.png 位于上层。';
}
async function loadAdvisor(src,local=false){
 const token=++advisorToken,candidate=new Image();
 try{candidate.src=src;await candidate.decode();if(token!==advisorToken)return;
 if(candidate.naturalWidth<712||candidate.naturalHeight<937){advisorStatus.textContent='模板至少需要 712 × 937 像素，才能容纳 (43, 73) 处的 669 × 864 头像。';return;}
 advisor=candidate;advisorStatus.textContent='模板已读取，请导入人物图片（至少 64 × 64）。';queueAdvisor();
 }catch(e){if(token===advisorToken)advisorStatus.textContent='无法读取小顾问模板，请重新选择。';}
 finally{if(local)URL.revokeObjectURL(src);}
}
// Template is loaded from local configuration.
// Separable Lanczos-3 with scale-aware support and premultiplied alpha.
function lanczosWeights(sourceSize,targetSize){
 const scale=Math.max(1,sourceSize/targetSize),support=3*scale;
 return Array.from({length:targetSize},(_,i)=>{
  const center=(i+.5)*sourceSize/targetSize-.5,weights=[];let sum=0;
  for(let j=Math.max(0,Math.ceil(center-support));j<=Math.min(sourceSize-1,Math.floor(center+support));j++){
   const z=(j-center)/scale;
   const v=Math.abs(z)<1e-9?1:Math.abs(z)>=3?0:(Math.sin(Math.PI*z)/(Math.PI*z))*(Math.sin(Math.PI*z/3)/(Math.PI*z/3));
   weights.push([j,v]);sum+=v;
  }
  return weights.map(([j,v])=>[j,v/sum]);
 });
}
async function lanczosPixels(data,sw,sh,dw,dh,version=renderVersion){
 const wx=lanczosWeights(sw,dw),wy=lanczosWeights(sh,dh),temp=new Float32Array(dw*sh*4),out=new Uint8ClampedArray(dw*dh*4);
 for(let y=0;y<sh;y++){if(y%8===0){await new Promise(resolve=>setTimeout(resolve,0));if(version!==renderVersion)return null;}for(let x=0;x<dw;x++){
  const k=(y*dw+x)*4;
  for(const [sx,v] of wx[x]){const j=(y*sw+sx)*4,a=data[j+3]/255;for(let c=0;c<3;c++)temp[k+c]+=data[j+c]*a*v;temp[k+3]+=a*v;}
 }}
 for(let y=0;y<dh;y++){if(y%8===0){await new Promise(resolve=>setTimeout(resolve,0));if(version!==renderVersion)return null;}for(let x=0;x<dw;x++){
  const k=(y*dw+x)*4;let a=0,r=0,g=0,b=0;
  for(const [sy,v] of wy[y]){const j=(sy*dw+x)*4;r+=temp[j]*v;g+=temp[j+1]*v;b+=temp[j+2]*v;a+=temp[j+3]*v;}
  out[k+3]=Math.max(0,Math.min(1,a))*255;
  if(a>1e-6){out[k]=r/a;out[k+1]=g/a;out[k+2]=b/a;}
 }}
 return out;
}
function sharpenPixels(data,w,h,amount=.22){
 const result=new Uint8ClampedArray(data);
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
  const k=(y*w+x)*4;if(data[k+3]<250)continue;
  const neighbors=[k-4,k+4,k-w*4,k+w*4];if(neighbors.some(j=>data[j+3]<250))continue;
  for(let c=0;c<3;c++){const avg=neighbors.reduce((s,j)=>s+data[j+c],0)/4;result[k+c]=data[k+c]+amount*(data[k+c]-avg);}
 }
 return result;
}
async function resizeLanczos(source,w,h,version=renderVersion,amount=.22){
 const input=source.getContext('2d').getImageData(0,0,source.width,source.height);
 const pixels=await lanczosPixels(input.data,source.width,source.height,w,h,version);if(!pixels||version!==renderVersion)return null;
 const out=document.createElement('canvas');out.width=w;out.height=h;
 out.getContext('2d').putImageData(new ImageData(sharpenPixels(pixels,w,h,amount),w,h),0,0);return out;
}
function cropSource(){
 const source=document.createElement('canvas');source.width=26*n;source.height=35*n;
 const p=source.getContext('2d');p.imageSmoothingQuality='high';
 if(background)p.drawImage(background,0,0,source.width,source.height);
 if(img)p.drawImage(img,x,y,source.width,source.height,0,0,source.width,source.height);
 return source;
}
let outputFrame=0,qualityTimer=0,sliderActive=false;
function cancelQuality(){renderVersion++;readyVersion=-1;updateSaveButtons();clearTimeout(qualityTimer);cancelAnimationFrame(outputFrame);cancelAnimationFrame(advisorFrame);}
function renderOutput(highQuality=true){
 cancelQuality();const version=renderVersion;
 outputFrame=requestAnimationFrame(async()=>{
  if(img){
   let out;
   if(highQuality){out=await resizeLanczos(cropSource(),156,210,version);if(!out||version!==renderVersion)return;}
   else{
    out=document.createElement('canvas');out.width=156;out.height=210;const p=out.getContext('2d');
    if(background)p.drawImage(background,0,0,156,210);
    p.drawImage(img,x,y,26*n,35*n,0,0,156,210);
   }
   preview.src=out.toDataURL('image/png');
  }
  await renderAdvisor(highQuality,version);if(version!==renderVersion)return;
  readyVersion=highQuality&&img?version:-1;updateSaveButtons();
  preview.title=advisorPreview.title=highQuality?'清晰成品，可右键保存':'快速预览，松手后生成清晰成品';
 });
}
function finishQuality(){cancelQuality();qualityTimer=setTimeout(()=>{if(!drag&&!sliderActive)renderOutput(true);},100);}
async function loadBackground(src,local=false){
 const token=++backgroundToken,candidate=new Image();
 try{candidate.src=src;await candidate.decode();if(token!==backgroundToken)return;background=candidate;
 renderOutput();
 }catch(e){if(token===backgroundToken){status.textContent='无法读取大头像背景，请检查右侧配置路径。';}}
 finally{if(local)URL.revokeObjectURL(src);}
}
// Template is loaded from local configuration.
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function draw(highQuality=true){
 if(!img)return;
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(displayImage,0,0);
 const a=x*scale,b=y*scale,w=26*n*scale,h=35*n*scale;
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.rect(0,0,canvas.width,canvas.height);ctx.rect(a,b,w,h);ctx.fill('evenodd');
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(a,b,w,h);
 renderOutput(highQuality);
}
function setSize(value,highQuality=true){
 if(!img)return;const parsed=Number(value);if(!Number.isFinite(parsed))return;
 const cx=x+26*n/2,cy=y+35*n/2;n=clamp(Math.round(parsed),1,limit);
 x=Math.round(clamp(cx-26*n/2,0,img.naturalWidth-26*n));y=Math.round(clamp(cy-35*n/2,0,img.naturalHeight-35*n));
 multiple.value=slider.value=n;size.textContent=`${26*n} × ${35*n} 像素`;draw(highQuality);
}
file.addEventListener('change',async()=>{
 const f=file.files[0];if(!f)return;const token=++loadToken,url=URL.createObjectURL(f),candidate=new Image();
 try{candidate.src=url;await candidate.decode();if(token!==loadToken)return;
 const max=Math.min(60,Math.floor(Math.min(candidate.naturalWidth/26,candidate.naturalHeight/35)));
 if(max<1){status.textContent='图片至少需要 26 × 35 像素，请重新选择。';return;}
 img=candidate;name=f.name.replace(/\.[^.]+$/,'');limit=max;n=Math.min(6,limit);drag=null;
 scale=Math.min(1,1000/img.naturalWidth,700/img.naturalHeight);
 canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
 displayImage.width=canvas.width;displayImage.height=canvas.height;displayImage.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 // Use the same scale on both axes; rounding affects only the outermost display edge.
 x=Math.floor((img.naturalWidth-26*n)/2);y=Math.floor((img.naturalHeight-35*n)/2);
 multiple.max=slider.max=limit;multiple.disabled=slider.disabled=false;
 status.textContent=`原图 ${img.naturalWidth} × ${img.naturalHeight}；最大 ${limit} 倍。`;
 setSize(n);
 }catch(e){if(token===loadToken)status.textContent='无法读取这张图片，请使用 PNG、JPEG 或 WebP。';}finally{URL.revokeObjectURL(url);}
});
slider.addEventListener('pointerdown',()=>{sliderActive=true;cancelQuality();});
slider.addEventListener('input',()=>{setSize(slider.value,false);if(!sliderActive)finishQuality();});
slider.addEventListener('change',()=>{sliderActive=false;finishQuality();});
function finishSlider(){if(sliderActive){sliderActive=false;finishQuality();}}
window.addEventListener('pointerup',finishSlider);window.addEventListener('pointercancel',finishSlider);
multiple.addEventListener('change',()=>setSize(multiple.value));
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*img.naturalWidth/r.width,y:(e.clientY-r.top)*img.naturalHeight/r.height};}
canvas.addEventListener('pointerdown',e=>{if(!img)return;const p=point(e);if(p.x<x||p.x>x+26*n||p.y<y||p.y>y+35*n)return;cancelQuality();drag={dx:p.x-x,dy:p.y-y,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);x=Math.round(clamp(p.x-drag.dx,0,img.naturalWidth-26*n));y=Math.round(clamp(p.y-drag.dy,0,img.naturalHeight-35*n));draw(false);});
function stop(){if(drag){drag=null;finishQuality();}}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('lostpointercapture',stop);

const localToken='__LOCAL_TOKEN__';
const localMode=location.protocol==='http:'&&localToken!=='__'+'LOCAL_TOKEN__';
const configFields={background:document.getElementById('cfgBackground'),advisor:document.getElementById('cfgAdvisor'),portrait_dir:document.getElementById('cfgPortraitDir'),advisor_dir:document.getElementById('cfgAdvisorDir')};
const localStatus=document.getElementById('localStatus'),outputName=document.getElementById('outputName');
let localReady=false,saving=false;
async function api(route,data){
 const options=data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':localToken},body:JSON.stringify(data)};
 const response=await fetch(route,options);const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');return result;
}
function fillConfig(cfg){for(const [key,field] of Object.entries(configFields))field.value=cfg[key];}
function updateSaveButtons(){
 // Called before local controls are initialized only when an actual interaction occurs.
 if(typeof localReady==='undefined')return;
 const ready=localReady&&!saving&&img&&readyVersion===renderVersion;
 document.getElementById('writePortrait').disabled=!ready||!background;
 document.getElementById('writeAdvisor').disabled=!ready||!advisor||advisorPreview.hidden;
 document.getElementById('writeBoth').disabled=!ready||!background||!advisor||advisorPreview.hidden;
}
async function reloadTemplates(){
 localReady=false;cancelQuality();background=null;advisor=null;advisorPreview.hidden=true;
 const stamp=Date.now();
 await Promise.all([loadBackground('/api/template/background?v='+stamp),loadAdvisor('/api/template/advisor?v='+stamp)]);
 localReady=!!background&&!!advisor;
 if(!localReady){updateSaveButtons();throw Error('模板读取失败，请检查配置路径。');}
 renderOutput();updateSaveButtons();
}
async function localAction(task){try{await task();}catch(e){localStatus.textContent=e.message;}}
for(const button of document.querySelectorAll('[data-choose]'))button.addEventListener('click',()=>localAction(async()=>{
 localStatus.textContent='请选择路径（系统选择窗口可能在浏览器后面）…';
 const key=button.dataset.choose;fillConfig(await api('/api/choose',{key}));
 if(key==='background'||key==='advisor')await reloadTemplates();
 localStatus.textContent='设置已保存，下次启动自动使用。';
}));
document.getElementById('applyConfig').addEventListener('click',()=>localAction(async()=>{
 const changes=Object.fromEntries(Object.entries(configFields).map(([k,v])=>[k,v.value]));
 fillConfig(await api('/api/config',changes));await reloadTemplates();localStatus.textContent='配置已保存。';
}));
for(const [key,field] of Object.entries(configFields))field.addEventListener('change',()=>localAction(async()=>{
 fillConfig(await api('/api/config',{[key]:field.value}));
 if(key==='background'||key==='advisor')await reloadTemplates();
 localStatus.textContent='设置已保存。';
}));
document.getElementById('reloadTemplates').addEventListener('click',()=>localAction(async()=>{await reloadTemplates();localStatus.textContent='已重新读取模板原文件。';}));
async function writeImages(kind){
 if(readyVersion!==renderVersion||saving)throw Error('请等待清晰成品生成后再保存。');
 saving=true;updateSaveButtons();
 try{
  const payload={name:outputName.value.trim(),overwrite:document.getElementById('overwrite').checked};
  if(kind!=='advisor')payload.portrait=preview.src;
  if(kind!=='portrait')payload.advisor=advisorPreview.src;
  const result=await api('/api/export',payload);localStatus.textContent='已保存：\n'+result.paths.join('\n');
 }finally{saving=false;updateSaveButtons();}
}
for(const [id,kind] of [['writePortrait','portrait'],['writeAdvisor','advisor'],['writeBoth','both']])document.getElementById(id).addEventListener('click',()=>localAction(()=>writeImages(kind)));
file.addEventListener('change',()=>{const f=file.files[0];if(f)outputName.value=f.name.replace(/\.[^.]+$/,'').replace(/[^\p{L}\p{N}_-]/gu,'_');});
async function initLocal(){
 if(!localMode){
  document.querySelectorAll('#localPanel input,#localPanel button').forEach(e=>e.disabled=true);
  localStatus.textContent='请双击“启动头像工具.cmd”，通过本地服务打开页面，以使用配置和直接保存。';
  return;
 }
 await localAction(async()=>{fillConfig(await api('/api/config'));await reloadTemplates();localStatus.textContent='本地配置已加载。请选择输出目录；新设置会自动记住。';});
}
initLocal();

</script>
</html>
